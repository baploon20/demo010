<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>停车月卡管理系统 - 新增月卡</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/addMonthCard.css">
</head>
<body>
     <header class="topbar">
        <div class="logo">🚗 智慧停车月卡管理系统</div>
        <nav>
            <a href="index.html">工作台首页</a>
            <a href="monthCard.html" class="">月卡管理</a>
            <a href="addMonthCard.html">新增月卡</a>
        </nav>
    </header>
    <div class="form-page">
        <div class="page-head">
            <button type="button" class="btn btn-outline" id="btnBack">← 返回月卡管理</button>
            <h2 class="page-title" id="pageTitle">新增月卡</h2>
        </div>

        <form id="cardForm" onsubmit="return false;">
            <!-- 车辆信息表单卡片 -->
            <section class="form-card">
                <h3 class="form-card-title">🚗 车辆信息</h3>
                <div class="form-grid">
                    <div class="form-item">
                        <label>车牌号 <em>*</em></label>
                        <input id="plateNo" placeholder="例：粤A12345">
                        <span class="error-msg" id="err-plateNo"></span>
                    </div>
                    <div class="form-item">
                        <label>车主姓名 <em>*</em></label>
                        <input id="ownerName" placeholder="请输入车主姓名">
                        <span class="error-msg" id="err-ownerName"></span>
                    </div>
                    <div class="form-item">
                        <label>手机号 <em>*</em></label>
                        <input id="phone" maxlength="11" placeholder="请输入 11 位手机号">
                        <span class="error-msg" id="err-phone"></span>
                    </div>
                    <div class="form-item">
                        <label>车辆类型 <em>*</em></label>
                        <select id="vehicleType">
                            <option value="">请选择</option>
                            <option>小型汽车</option>
                            <option>大型汽车</option>
                            <option>新能源车</option>
                        </select>
                        <span class="error-msg" id="err-vehicleType"></span>
                    </div>
                    <div class="form-item">
                        <label>卡类型 <em>*</em></label>
                        <select id="cardType">
                            <option value="">请选择</option>
                            <option>月卡</option>
                            <option>季卡</option>
                            <option>半年卡</option>
                            <option>年卡</option>
                        </select>
                        <span class="error-msg" id="err-cardType"></span>
                    </div>
                </div>
            </section>

            <!-- 缴费信息表单卡片 -->
            <section class="form-card">
                <h3 class="form-card-title">💰 缴费信息</h3>
                <div class="form-grid">
                    <div class="form-item">
                        <label>缴费金额（元）<em>*</em></label>
                        <input id="payAmount" placeholder="请输入缴费金额">
                        <span class="error-msg" id="err-payAmount"></span>
                    </div>
                    <div class="form-item">
                        <label>开始日期 <em>*</em></label>
                        <input type="date" id="startDate">
                        <span class="error-msg" id="err-startDate"></span>
                    </div>
                    <div class="form-item">
                        <label>结束日期 <em>*</em></label>
                        <input type="date" id="endDate">
                        <span class="error-msg" id="err-endDate"></span>
                    </div>
                    <div class="form-item">
                        <label>剩余有效天数（天）</label>
                        <input id="remainDay" readonly placeholder="根据起止日期自动计算">
                        <span class="error-msg" id="err-remainDay"></span>
                    </div>
                    <div class="form-item">
                        <label>状态</label>
                        <input id="status" readonly placeholder="根据结束日期自动计算">
                        <span class="error-msg" id="err-status"></span>
                    </div>
                </div>
            </section>

            <!-- 底部操作按钮 -->
            <div class="form-actions">
                <button type="submit" class="btn btn-blue" id="btnSubmit">保存</button>
                <button type="button" class="btn btn-gray" id="btnCancel">取消</button>
            </div>
        </form>
    </div>

    
    <script src="js/indexScript.js"></script>
</body>
</html>
